# Pre-Implementation CP0 - Test Framework Baseline CI.
# Runs on push and pull_request. Uses the pinned Go toolchain
# (standards/technical-preferences.md: Go 1.26.5).
name: tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.5'
      - name: go mod tidy
        run: go mod tidy
      - name: go vet
        run: go vet ./...
      - name: go test -race
        run: go test -race ./...
