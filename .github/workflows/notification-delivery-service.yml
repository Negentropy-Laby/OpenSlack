name: Notification Delivery Service CI

on:
  pull_request:
    branches:
      - main
    paths:
      - services/notification-delivery/**
      - services/*/go.mod
      - services/*/go.sum
      - README.md
      - docs/README.md
      - design/cdd/module-index.md
      - design/cdd/workstreams/notification-delivery/README.md
      - docs/user/guides/notification-delivery-operations.md
      - docs/user/guides/core-workflows.md
      - docs/user/cli-reference.md
      - docs/architecture/integrations/notification-delivery.md
      - docs/contributor/notification-delivery/**
      - docs/security/notification-delivery-boundary.md
      - docs/evidence/notification-delivery-evidence.md
      - docs/reference/**
      - memory_bank/**
      - production/**
      - integration/gates/ib6-history-import.json
      - .openslack/modules.yaml
      - bun.lock
      - package.json
      - vitest.config.ts
      - go.work
      - go.work.sum
      - scripts/go-check.sh
      - scripts/go-check/**
      - scripts/documentation/**
      - scripts/notification-docs/**
      - .github/workflows/notification-delivery-service.yml
      - .github/workflows/openslack-reusable-validate.yml
      - packages/github/src/__tests__/notification-delivery-service-workflow.test.ts
      - packages/workspace/src/__tests__/go-check-script.test.ts
  push:
    branches:
      - main
    paths:
      - services/notification-delivery/**
      - services/*/go.mod
      - services/*/go.sum
      - README.md
      - docs/README.md
      - design/cdd/module-index.md
      - design/cdd/workstreams/notification-delivery/README.md
      - docs/user/guides/notification-delivery-operations.md
      - docs/user/guides/core-workflows.md
      - docs/user/cli-reference.md
      - docs/architecture/integrations/notification-delivery.md
      - docs/contributor/notification-delivery/**
      - docs/security/notification-delivery-boundary.md
      - docs/evidence/notification-delivery-evidence.md
      - docs/reference/**
      - memory_bank/**
      - production/**
      - integration/gates/ib6-history-import.json
      - .openslack/modules.yaml
      - bun.lock
      - package.json
      - vitest.config.ts
      - go.work
      - go.work.sum
      - scripts/go-check.sh
      - scripts/go-check/**
      - scripts/documentation/**
      - scripts/notification-docs/**
      - .github/workflows/notification-delivery-service.yml
      - .github/workflows/openslack-reusable-validate.yml
      - packages/github/src/__tests__/notification-delivery-service-workflow.test.ts
      - packages/workspace/src/__tests__/go-check-script.test.ts
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Validate notification delivery service
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    defaults:
      run:
        shell: bash
        working-directory: services/notification-delivery
    env:
      EXPECTED_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
      GOWORK: 'off'
    steps:
      - name: Check out the exact source head
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
          fetch-depth: 1
      - name: Require the exact source head
        run: |
          set -euo pipefail
          checkout_commit="$(git rev-parse --verify 'HEAD^{commit}')"
          test "$checkout_commit" = "$EXPECTED_COMMIT"
      - name: Set up the exact Go toolchain
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: '1.26.5'
          cache: true
          cache-dependency-path: services/notification-delivery/go.sum
      - name: Require the exact Go toolchain
        run: |
          set -euo pipefail
          test "$(go env GOVERSION)" = "go1.26.5"
          test "$(go env GOWORK)" = "off"
          go work edit -json "$GITHUB_WORKSPACE/go.work" >/dev/null
          test -z "$(gofmt -l "$GITHUB_WORKSPACE/scripts/go-check/"*.go)"
          (
            cd "$GITHUB_WORKSPACE/scripts/go-check"
            GO111MODULE=off go test .
          )
      - name: Validate the notification workflows
        working-directory: .
        run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.12 .github/workflows/notification-delivery-service.yml .github/workflows/openslack-reusable-validate.yml
      - name: Pull pinned Go verification images
        working-directory: .
        run: |
          set -euo pipefail
          docker pull golang:1.26.5@sha256:3aff6657219a4d9c14e27fb1d8976c49c29fddb70ba835014f477e1c70636647
          docker pull postgres:18.4@sha256:3a82e1f56c8f0f5616a11103ac3d47e632c3938698946a7ad26da0df1334744a
          docker pull prom/prometheus:v3.13.1@sha256:3c42b892cf723fa54d2f262c37a0e1f80aa8c8ddb1da7b9b0df9455a35a7f893
      - name: Run reviewed Go workspace verifier
        working-directory: .
        run: bash scripts/go-check.sh --all
      - name: Set up the exact Bun toolchain
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.11
      - name: Install root dependencies
        working-directory: .
        run: bun install --frozen-lockfile
      - name: Verify root documentation governance
        working-directory: .
        run: |
          set -euo pipefail
          bun run docs:verify
          bun run docs:migration-check
          bun run docs:generate
          git diff --exit-code -- \
            memory_bank/t0_core/current_state.md \
            memory_bank/t0_core/release_state.md \
            memory_bank/t2_execution/current_roadmap.md \
            production/project-roadmap.md
      - name: Verify notification delivery documentation
        working-directory: .
        run: bun run docs:notification-verify
      - name: Render the Compose configuration
        run: docker compose --env-file deploy/local.env.example config >/dev/null
