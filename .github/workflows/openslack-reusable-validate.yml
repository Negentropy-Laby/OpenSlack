name: OpenSlack Reusable Validate

on:
  workflow_call:
    inputs:
      validation_level:
        required: true
        type: string

jobs:
  validate:
    runs-on: ubuntu-latest
    env:
      OPENSLACK_HARNESS_COMPATIBILITY: required
      DEEPSEEK_HARNESS_CHECKOUT: ${{ github.workspace }}/.openslack.local/ci/harness-original
    permissions:
      contents: read
      pull-requests: read

    steps:
      # actions/checkout v6.0.2
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          fetch-depth: 0

      # actions/setup-node v6.4.0
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: '24.18.1'
          package-manager-cache: false

      # This is a read-only, fixed compatibility dependency, never a patched peer.
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          repository: deepseek-ai/deepseek-harness
          ref: 22ddee3792402c3e70ec5f86a63c3e3e895a2f60
          path: .openslack.local/ci/harness-original
          persist-credentials: false

      - name: Prepare original Harness artifacts and public declarations
        shell: bash
        working-directory: .openslack.local/ci/harness-original
        run: |
          set -euo pipefail
          # Compare actual tracked bytes, index entries and refs, not only Git's
          # possibly normalized text diff. No source, secrets or identity is copied.
          capture_harness_inputs() {
            node --input-type=module <<'NODE'
          import { execFileSync } from 'node:child_process';
          import { createHash } from 'node:crypto';
          import { lstatSync, readFileSync, readlinkSync } from 'node:fs';
          const git = (...args) => execFileSync('git', args, { encoding: 'utf8', maxBuffer: 32 * 1024 * 1024 });
          const sha = bytes => createHash('sha256').update(bytes).digest('hex');
          const files = git('ls-files', '-z').split('\0').filter(Boolean).sort().map(path =>
            [path, lstatSync(path).mode, sha(lstatSync(path).isSymbolicLink() ? readlinkSync(path) : readFileSync(path))]);
          console.log(sha(JSON.stringify([git('rev-parse', 'HEAD'), git('ls-files', '--stage'),
            git('for-each-ref', '--format=%(refname) %(objectname)'), files])));
          NODE
          }
          openslack_harness_before=$(capture_harness_inputs)
          npm install --global pnpm@11.28.5 --ignore-scripts
          pnpm install --frozen-lockfile
          pnpm run build:artifacts
          pnpm run build:check
          test "$openslack_harness_before" = "$(capture_harness_inputs)"
          git diff --exit-code
          git diff --cached --exit-code
          node -e "const c=require('node:child_process'); if(c.execFileSync('git',['rev-parse','HEAD'],{encoding:'utf8'}).trim()!=='22ddee3792402c3e70ec5f86a63c3e3e895a2f60') throw new Error('Harness dependency head drift');"

      # actions/setup-go v6.5.0
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16
        with:
          go-version: '1.26.5'
          cache: true
          cache-dependency-path: 'services/*/go.sum'

      # Setup bun
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0

      - run: bun install --frozen-lockfile

      - run: bun run build

      - name: Build the OpenSlack-owned external plugin
        run: bun integrations/deepseek-harness/prepare-compatibility.mjs

      - name: Verify the private supervisor module
        working-directory: integrations/deepseek-harness/native-supervisor
        env:
          GOWORK: 'off'
          GOTOOLCHAIN: local
        shell: bash
        run: |
          set -euo pipefail
          test "$(go env GOWORK)" = off
          go test ./...
          go vet ./...
          git diff --exit-code -- go.mod go.sum

      - name: Documentation governance consistency
        run: |
          set -euo pipefail
          bun run docs:verify
          bun run docs:migration-check
          bun run docs:generate
          git diff --exit-code -- \
            memory_bank/t0_core/current_state.md \
            memory_bank/t0_core/release_state.md \
            memory_bank/t2_execution/current_roadmap.md \
            production/project-roadmap.md

      - name: Regenerate status doc
        run: bun run openslack status generate

      - name: Check for uncommitted status changes
        run: git diff --exit-code docs/status/current.md

      - name: Status consistency check
        run: bun run openslack status verify

      - name: Notification delivery documentation consistency
        run: bun run docs:notification-verify

      - name: Workspace validate
        run: bun run openslack workspace validate

      - name: Policy validate
        run: bun run openslack self validate

      # Every policy-only PR must exercise the strict production Go decoder.
      # The release workflow's source-path filter is not sufficient for grants.
      - name: Committed cleanup policy audit
        working-directory: services/cleanup-broker
        env:
          GOWORK: 'off'
        run: go test ./internal/permit -count=1

      - name: Typecheck
        run: bun run typecheck

      - name: Lint
        run: bun run lint

      - name: Tests
        run: npx vitest run

      - name: Append-only budget compatibility history
        if: github.event_name == 'pull_request'
        env:
          BUDGET_COMPATIBILITY_BASE: ${{ github.event.pull_request.base.sha }}
        run: node scripts/verify-budget-compatibility-history.mjs --base "$BUDGET_COMPATIBILITY_BASE"

      - name: Collected test-count drift
        run: node scripts/verify-test-counts.mjs

      - name: Self eval
        run: bun run openslack self eval --suite golden

      - name: Security scan (black zone check)
        run: bun run openslack self classify-pr --paths "$(git diff --name-only HEAD~1 || echo docs/test.md)" --format json

  macos-read-paths:
    runs-on: macos-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: '22'
          package-manager-cache: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0
      - run: bun install --frozen-lockfile
      - run: bun run build
      - name: Native APFS and portable cleanup request boundaries
        run: >-
          node node_modules/vitest/vitest.mjs run
          packages/workflows/src/__tests__/workflow-read-path.test.ts
          packages/workflows/src/__tests__/workflow-run-read-query.test.ts
          packages/pr/src/__tests__/cleanup-executor-auth.test.ts
