config_map:
  NOTIFICATION_SERVICE_DEPLOYMENT_DIGEST:
    value: "sha256:<64 lowercase hex from deployment-verified OCI image digest>"
    required: true
    default: none
    persistence: process-only; never notification storage
    public_wire: docs/api/openapi.yaml#/components/headers/NotificationServiceDeploymentDigest
    authority: docs/architecture/adr-0005-openslack-handoff-integration.md
  PAYLOAD_MAX_BYTES:
    value: 262144
    unit: bytes
    authority: design/cdd/notification-store.md
  IDEMPOTENCY_KEY_MAX_LEN:
    value: 255
    authority: design/cdd/notification-store.md
  IDEMPOTENCY_KEY_CHARSET:
    value: "^[A-Za-z0-9._-]{1,255}$"
    authority: design/cdd/notification-store.md
  JUSTIFICATION_MIN_LEN:
    value: 20
    authority: design/cdd/notification-store.md
  JUSTIFICATION_MAX_LEN:
    value: 1024
    authority: design/cdd/notification-store.md
  LEASE_TTL_MAX:
    value: 30s
    authority: design/cdd/delivery.md
    resolves: design/cdd/notification-store.md provisional maximum
  LEASE_TTL:
    value: 30s
    authority: design/cdd/delivery.md
  RECOVERY_BATCH_MAX:
    value: 100
    authority: design/cdd/notification-store.md
  RECOVERY_BATCH_SIZE:
    value: 100
    range: 1..100
    authority: docs/architecture/architecture.md
  RECOVERY_INTERVAL:
    value: 5s
    range: "(0, LEASE_TTL]"
    authority: docs/architecture/architecture.md
  METRICS_COLLECTION_TIMEOUT:
    value: 2s
    constraint: less than Prometheus 5s scrape timeout
    authority: design/cdd/reliability-observability.md
  STORE_LIST_PAGE_DEFAULT:
    value: 100
    source_name: LIST_PAGE_DEFAULT
    authority: design/cdd/notification-store.md
  STORE_LIST_PAGE_MAX:
    value: 500
    source_name: LIST_PAGE_MAX
    authority: design/cdd/notification-store.md
  VENDOR_LIST_PAGE_DEFAULT:
    value: 50
    source_name: LIST_PAGE_DEFAULT
    authority: design/cdd/vendor-registry.md
  VENDOR_LIST_PAGE_MAX:
    value: 200
    source_name: LIST_PAGE_MAX
    authority: design/cdd/vendor-registry.md
  MAX_ACTIVE_KEYS_PER_PRINCIPAL:
    value: 2
    authority: design/cdd/caller-access.md
  API_KEY_PEPPER_ACTIVE:
    value: <deployment secret; env-supplied via startup allowlist; never persisted (CTRL-016)>
    authority: docs/architecture/adr-0003-api-key-authorization.md
  API_KEY_PEPPER_PREVIOUS:
    value: <deployment secret; env-supplied via startup allowlist; never persisted (CTRL-016); optional grace generation>
    authority: docs/architecture/adr-0003-api-key-authorization.md
  CALLER_RATE_PER_MINUTE:
    value: 60
    authority: design/cdd/caller-access.md
  OPERATOR_READ_RATE_PER_MINUTE:
    value: 60
    authority: design/cdd/caller-access.md
  OPERATOR_MUTATION_RATE_PER_MINUTE:
    value: 10
    authority: design/cdd/caller-access.md
  RATE_LIMIT_RETRY_AFTER_MAX:
    value: 60s
    authority: design/cdd/caller-access.md
  VENDOR_ID_CHARSET:
    value: "^[a-z0-9-]{1,64}$"
    authority: design/cdd/vendor-registry.md
  ENDPOINT_PORT_ALLOWLIST:
    value: [443]
    authority: design/cdd/vendor-registry.md
  ENDPOINT_METHOD_ALLOWLIST:
    value: [POST]
    allowed_expansion: [POST, PUT, PATCH]
    authority: design/cdd/vendor-registry.md
  ENDPOINT_AUTH_STRATEGY_ALLOWLIST:
    value: [bearer]
    authority: design/cdd/vendor-registry.md
    public_wire: docs/api/openapi.yaml#/components/schemas/EndpointConfigInput/properties/auth_strategy
  CREDENTIAL_REF_SCHEME_ALLOWLIST:
    value: [env]
    authority: design/cdd/vendor-registry.md
    architecture_resolution: docs/architecture/adr-0004-ssrf-safe-http.md
  CREDENTIAL_PROFILE_VALIDATOR:
    value: bearer-env-v1
    required: true
    authority: design/cdd/vendor-registry.md
  STATIC_HEADER_NAME_ALLOWLIST:
    value: [accept, content-type, user-agent]
    authority: design/cdd/vendor-registry.md
  FORBIDDEN_CIDR_EXCEPTION_RANGES:
    value:
      - loopback
      - link_local
      - metadata
      - multicast
      - unspecified
      - documentation
      - reserved
    authority: design/cdd/vendor-registry.md
    architecture_resolution: docs/architecture/adr-0004-ssrf-safe-http.md
  MIN_CIDR_EXCEPTION_PREFIX_LENGTH_V4:
    value: 8
    authority: design/cdd/vendor-registry.md
  MIN_CIDR_EXCEPTION_PREFIX_LENGTH_V6:
    value: 48
    authority: design/cdd/vendor-registry.md
  OWNING_SCOPE_CHARSET:
    value: "^[a-z0-9._-]{1,128}$"
    authority: design/cdd/vendor-registry.md
  ACTOR_SCOPE_SET_MAX:
    value: 32
    authority: design/cdd/vendor-registry.md
  ENDPOINT_URL_MAX_BYTES:
    value: 2048
    authority: design/cdd/vendor-registry.md
  TRANSPORT_AUTH_HEADERS_MAX:
    value: 32
    authority: design/cdd/vendor-registry.md
  ADMIN_IDEMPOTENCY_KEY_CHARSET:
    value: "^[A-Za-z0-9._-]{1,255}$"
    authority: design/cdd/vendor-registry.md
  DISABLE_REASON_MAX_BYTES:
    value: 1024
    authority: design/cdd/vendor-registry.md
  ENDPOINT_MAX_REQUEST_BODY_BYTES:
    value: 262144
    authority: design/cdd/vendor-registry.md
  MAX_ATTEMPTS:
    value: 25
    authority: design/cdd/delivery.md
  MAX_AGE:
    value: 24h
    authority: design/cdd/delivery.md
  RETRY_BASE_DELAY:
    value: 1s
    authority: design/cdd/delivery.md
  RETRY_DELAY_CAP:
    value: 1h
    authority: design/cdd/delivery.md
  RETRY_AFTER_CAP:
    value: 1h
    authority: design/cdd/delivery.md
  HTTP_HARD_TIMEOUT:
    value: 10s
    authority: design/cdd/delivery.md
  RESULT_COMMIT_MARGIN:
    value: 5s
    authority: design/cdd/delivery.md
  DEADLINE_CLAIM_BUDGET:
    value: 5s
    authority: design/cdd/delivery.md
  DESTINATION_ADDRESS_POLICY:
    value:
      default: deny_non_public
      validate_all_A_AAAA: true
      dial_pinned_address: true
    authority: design/cdd/delivery.md
    architecture_resolution: docs/architecture/adr-0004-ssrf-safe-http.md
  REPLAY_BATCH_MAX:
    value: 100
    authority: design/cdd/operations-control.md
  DEAD_ALERT_THRESHOLD:
    value: 0
    predicate: dead_count > value
    authority: design/cdd/reliability-observability.md
  DEAD_ALERT_FOR:
    value: 5m
    authority: design/cdd/reliability-observability.md
  GO_TOOLCHAIN:
    value: 1.26.5
    authority: standards/technical-preferences.md
  POSTGRESQL_SERVER:
    value: "18.4"
    authority: standards/technical-preferences.md
