version: 1
status: approved
last_updated: 2026-07-22
purpose: >
  Cross-document authority map for the approved Specification and Architecture
  documents. Implementation evidence for B1-B4 is linked separately and does
  not change behavioral ownership.
implementation_evidence: docs/testing/b1-b4-ac-evidence.json

authority_rules:
  - Each identifier has exactly one behavioral authority.
  - OpenAPI owns public HTTP wire shapes; CDD owns behavior and internal contracts.
  - Architecture may select mechanisms but may not weaken a CDD invariant.
  - A consumer reference does not grant write ownership.

schema_map:
  ValidatedIntake:
    owner: Notification Store
    authority: design/cdd/notification-store.md
    public_wire: docs/api/openapi.yaml#/components/schemas/NotificationSubmit
    referenced_by:
      - design/cdd/caller-access.md
      - docs/architecture/architecture.md
  Notification:
    owner: Notification Store
    authority: design/cdd/notification-store.md
    storage_projection: docs/architecture/data-model.md#notifications
    public_projection: docs/api/openapi.yaml#/components/schemas/NotificationStatus
    referenced_by:
      - design/cdd/delivery.md
      - design/cdd/operations-control.md
      - design/cdd/reliability-observability.md
  DeliveryAttempt:
    owner: Notification Store
    authority: design/cdd/notification-store.md
    storage_projection: docs/architecture/data-model.md#delivery_attempts
    public_projection: docs/api/openapi.yaml#/components/schemas/AttemptItem
    referenced_by:
      - design/cdd/delivery.md
      - design/cdd/operations-control.md
  TransitionRequest:
    owner: Notification Store
    authority: design/cdd/notification-store.md
    visibility: internal
    referenced_by:
      - design/cdd/delivery.md
      - design/cdd/operations-control.md
      - docs/architecture/architecture.md
  DeliveryResult:
    owner: Notification Store
    authority: design/cdd/notification-store.md
    classification_owner: design/cdd/delivery.md
    visibility: internal
  VendorRecord:
    owner: Vendor Registry
    authority: design/cdd/vendor-registry.md
    storage_projection: docs/architecture/data-model.md#vendors
    public_projection:
      list: docs/api/openapi.yaml#/components/schemas/VendorListItem
      detail: docs/api/openapi.yaml#/components/schemas/VendorStateSummary
  EndpointVersion:
    owner: Vendor Registry
    authority: design/cdd/vendor-registry.md
    storage_projection: docs/architecture/data-model.md#endpoint_versions
    public_projection: docs/api/openapi.yaml#/components/schemas/EndpointVersionListItem
  DeliveryConfigSnapshot:
    owner: Vendor Registry
    authority: design/cdd/vendor-registry.md
    visibility: internal
    referenced_by:
      - design/cdd/delivery.md
      - docs/architecture/adr-0004-ssrf-safe-http.md
  AdminCommand:
    owner: Vendor Registry
    authority: design/cdd/vendor-registry.md
    public_wire: docs/api/openapi.yaml#/components/schemas/AdminCommand
  AdminAuditEvent:
    owner: Vendor Registry
    authority: design/cdd/vendor-registry.md
    storage_projection: docs/architecture/data-model.md#admin_audit_events
    public_projection: docs/api/openapi.yaml#/components/schemas/AuditItem
  PrincipalRecord:
    owner: Caller Access
    authority: design/cdd/caller-access.md
    storage_projection: docs/architecture/data-model.md#principals
  AccessKeyRecord:
    owner: Caller Access
    authority: design/cdd/caller-access.md
    storage_projection: docs/architecture/data-model.md#access_keys
  OpenSlackBootstrapOutput:
    owner: Caller Access
    authority: docs/architecture/adr-0005-openslack-handoff-integration.md#principals-and-deployment-evidence
    visibility: protected_deployment_file
  ActorContext:
    owner: Caller Access
    authority: design/cdd/caller-access.md
    visibility: internal
    specialized_contracts:
      Store: design/cdd/notification-store.md
      VendorRegistry: design/cdd/vendor-registry.md
    referenced_by:
      - design/cdd/delivery.md
      - design/cdd/operations-control.md
      - design/cdd/reliability-observability.md
  ReplayPreview:
    owner: Operations Control
    authority: design/cdd/operations-control.md
    public_wire: docs/api/openapi.yaml#/components/schemas/ReplayPreviewResponse
  ReplayExecution:
    owner: Operations Control
    authority: design/cdd/operations-control.md
    public_wire: docs/api/openapi.yaml#/components/schemas/ReplayExecuteResponse
  MetricSnapshot:
    owner: Reliability Observability
    authority: design/cdd/reliability-observability.md
    visibility: deployment

