      - id: agent_runtime
        name: Agent Runtime
        maturity: local_ready
        operatorConfigured: false
        externalBlockers:
          - model_endpoint_not_configured
          - live_provider_smoke_pending
        evidenceRefs:
          - commit:ae04404ddb548da8019754561c11a357ae2b794f
          - test:packages/agent-runtime/src/__tests__/openai-compatible-runtime.test.ts
    notes: >-
      Agent Runtime includes the governed OpenAI-compatible Chat Completions provider and repository tool plane with worktree containment, permission enforcement, budget and response limits, redaction, schema-before-complete, provider-neutral setup/doctor/smoke UX, and preview-first native-keychain credential import. Repository read, search, and diff results now apply context-aware source projections that preserve non-secret code expressions while continuing to redact credential literals and using conservative fallback for configuration, unknown, invalid UTF-8, and binary content before provider reuse or transcript persistence.
      Full 2D/2E Collaboration Layer active with typed workflow template preview/execute and dashboard with filters (--owner, --module, --risk, --blocker, --type). The GitHub watch delivery router records route-level notification success/failure with stable idempotency evidence, preserves completed routes across retry/restart, and emits fixed live-state/scope diagnostics without storing webhook prose or credentials. Workflow engine with JS module discovery, preview, dry-run, execute, resume, trust levels, and inspect (HTML/JSON/Markdown). Dynamic Workflow Parity v1 active with Operator workflow recommendation/ultracode draft trigger, dynamic workflow draft generation, pattern registry (classify-and-act, fanout-synthesize, adversarial-verification, generate-filter, tournament, loop-until-done, model-router), workflow policy config, run listing/control evidence, save/export-skill, budget/model/isolation metadata, and helper APIs on ctx.workflow. Dynamic Workflow UX Closure active with workflow start aggregation, catalog preview, progress evidence model, TUI workflow home and run drilldown, save-run to project/user/Claude project, and budget/routing visibility across draft/run evidence. Event model, activity feed, digest, handoff, decision, and room views with agent display name resolution. Authz-gated chat cards for handoffs, decisions, tasks, workflows, and plans. Agent registry v1 to v2 migration command. TUI dashboard and room views via --format tui. Workflow artifact PRs use one current-head human Workflow-Trust review, deterministic base/head tree evidence, and one Governance Issue only for new/core artifacts; legacy proposal/review publishers remain available but are not merge gates. Run audit, improvement, split with native sub-issue linking and linear dependency fallback, workflow-aware PRMS blocking, and post-merge governance finalization remain active. Profile Sync Robot active with config-driven check/preview/run, idempotent branch naming, failure issue cre