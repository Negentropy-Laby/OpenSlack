    notes: Stable release verification is available from the installed CLI and requires an out-of-band trusted Ed25519 public key; archive, SBOM, provenance, signature, identity fields, and subjects are verified without a source checkout or Bun. The public 0.2.0 embedding surface is limited to plugin-api, plugin-host, sdk, and plugin-testkit, with Apache-2.0 metadata, exact staged dependency rewriting, canonical tarball manifests, and clean-consumer ESM/declaration/TypeScript/isolated-host verification; registry publication remains externally gated. The declarative contract, typed SDK helpers, deterministic G1-G17 testkit, and instance-scoped Red host keep strict exact-byte loading, deterministic integrity lock, independent capability/target policy, atomic per-kind registries, required audit writes, and blockers-only bundled PRMS normalization. Testkit reports are authoring diagnostics only and always require independent Host reauthorization. Workspace and installed plugins remain declarative and non-executable; dynamic product-surface registration, auto-discovered code, and sandbox claims remain out of scope. The secret-free capstone harness locks evidence to one tested commit, both supported platforms, 11 fixed steps, bounded redacted references, and 30-day freshness without receiving privileged credentials.

