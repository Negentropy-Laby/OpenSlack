    notes: >-
      Agent Runtime includes the governed OpenAI-compatible Chat Completions provider and repository tool plane with worktree containment, permission enforcement, budget and response limits, redaction, schema-before-complete, provider-neutral setup/doctor/smoke UX, and preview-first native-keychain credential import. Repository read, search, and diff results now apply context-aware source projections that preserve non-secret code expressions while continuing to redact credential literals and using conservative fallback for configuration, unknown, invalid UTF-8, and binary content before provider reuse or transcript persistence.
      Full 2D/2E Collaboration Layer active with typed workflow template preview/execute and dashboard with filters (--owner, --module, --risk, --blocker, --type). The GitHub watch delivery router records route-level notification success/failure with stable idempotency evidence, preserves completed routes across retry/restart, and emits fixed live-state/scope diagnostics without storing webhook prose or credentials. Workflow engine with JS module discovery, preview, dry-run, execute, resume, trust levels, and inspect (HTML/JSON/Markdown). Dynamic Workflow Parity v1 active with Operator workflow recommendation/ultracode draft trigger, dynamic workflow draft generation, pattern registry (classify-and-act, fanout-synthesize, adversarial-verification, generate-filter, tournament, loop-until-done, model-router), workflow policy config, run listing/control evidence, save/export-skill, budget/model/isolation metadata, and helper APIs on ctx.workflow. Dynamic Workflow UX Closure active with workflow start aggregation, catalog preview, progress evidence model, TUI workflow home and run drilldown, save-run to project/user/Claude project, and budget/routing visibility across draft/run evidence. Event model, activity feed, digest, handoff, decision, and room views with agent display name resolution. Authz-gated chat cards for handoffs, decisions, tasks, workflows, and plans. Agent registry v1 to v2 migration command. TUI dashboard and room views via --format tui. Workflow artifact PRs use one current-head human Workflow-Trust review, deterministic base/head tree evidence, and one Governance Issue only for new/core artifacts; legacy proposal/review publishers remain available but are not merge gates. Run audit, improvement, split with native sub-issue linking and linear dependency fallback, workflow-aware PRMS blocking, and post-merge governance finalization remain active. Profile Sync Robot active with config-driven check/preview/run, idempotent branch naming, failure issue creation, profile_sync.failed event, watch-daemon auto-pr trigger (manual/watch/auto-pr modes), dedupe queue/worker, TUI profile workbench with 6 actions, PRMS profile-sync governance gate (BLOCKED_PROFILE_SYNC_GATE), and buildProfileSyncStatus finalizer. Agent Conversations active with typed thread model (7 message kinds), JSONL persistence, secret scanning on messages and metadata, agent type resolution with Claude Code subagent compatibility, workbench ask/action audit trail, and conversation commands (start/list/show/send/summarize/archive). Agent Runtime (@openslack/agent-runtime) active with launcher, permission profiles, run store, transcript recording, an instance-scoped provider registry, fail-closed runtime gating, test-only local adapter injection, process bridge diagnostics, Aby external runtime doctor/setup/smoke, worktree isolation, fail-closed metadata validation, MCP descriptor status UX, and redacted bridge stderr summaries. Lifecycle events (started/completed/failed) are wired through executeRun/executeResume via agentEventEmitter bridge into collaboration recordEvent, with activity feed and room integration. TUI AgentRun detail view with bridge/MCP observability timeline and Agent Runtime diagnostics view. The private Negentropy bridge now exports a schema-pinned, canonical external/L5/SHADOW/opt-in projection-only preview from package APIs, never CLI prose; it remains NOT_REGISTERABLE until external signing and administrator registration. Doctor/status use a strict three-state model and report VERIFIED_BY_NEGENTROPY only when a completed saved receipt agrees with the live HTTPS contribution and diagnostics. OpenSlack never reads a signing private key, supplies authorization, owns AuthorityState, emits ENFORCE, or claims activation.
      BusinessOutcomeProjection v1 aggregates only injected, evidence-backed event/run/PRMS/notification snapshots, preserves observed/configured-estimate/unknown basis per metric, and never invents revenue, durable acceptance, delivery, or human approval.
      Organization Graph Core v1 is active as a pure, rebuildable projection package with closed snapshot/delta contracts, derived stable identities, deterministic integrity hashes, bounded query/explain, and an adversarially checked local atomic store. It performs no network or authoritative business mutation.
      GS1-A adds an importable pure Go Organization Graph shadow with a TypeScript-owned exact-byte contract manifest, generated schema/vector mirrors, strict JSON and ECMAScript canonicalization parity, stable identity and integrity behavior, bounded query/cursor/pagination/explain behavior, and 79 self-replaying cross-language golden cases. GS1-A itself added no HTTP server, durable store, Qoder read cutover, or runtime authority transfer.
      GS1-B adds a PostgreSQL-backed Go shadow ingest service with immutable canonical Snapshot and Delta bytes, per-scenario cursor/revision CAS, deterministic request fingerprints, durable idempotency and reconciliation receipts, bounded loopback/internal HTTP, strict OpenAPI request/response validation, health/version/metrics endpoints, migrations, container inputs, and Prometheus rules. The TypeScript local store remains the sole writer and authority: it commits locally before an explicitly injected, fail-open observational shadow call, serializes same-process publication per root/scenario, and uses only bounded idempotent HTTP retries for cross-process transition-order races. No Qoder read cutover, Go authority transfer, remote exposure, authenticated production qualification, release, or production-readiness claim is made.
      GS1-C adds actual HTTP-to-PostgreSQL composition qualification for first Snapshot, duplicate, full-Snapshot CAS, Delta, and bounded query readback; exact receipt recovery after a committed transaction loses its response; same-cursor/different-byte and concurrent-writer conflicts; rollback and corrupted canonical-byte/metadata fail-closed checks; incompatible schema-row rejection; exact 10,000-node/25,000-edge plus over-limit qualification; and a same-volume PostgreSQL restart followed by a new process/pool receipt and head replay. Query cursor rotation accepts at most one distinct bounded previous verification secret while the active secret alone signs new cursors. TypeScript shadow observations now report real queue state or unknown instead of inventing zero backlog. The Go service remains an isolated shadow, TypeScript remains the sole user-visible authority, and this batch makes no read-cutover, Qoder, authenticated external, release, live, or production claim.
      GS2-A freezes a TypeScript-owned, exact-byte Software Delivery source-schema and projector-vector bundle, including historical, missing, incomplete, demo-fixture, boundary, deterministic randomized, and fail-closed inputs. A pure Go package accepts only the same bounded typed-source bytes and recomputes canonical Snapshot bytes, integrity, node and edge identities, completeness, warnings, and errors against the generated mirror. It performs no external reads, HTTP handling, store writes, Scenario registration, or Qoder integration. TypeScript remains the sole calculation and local read authority; this batch makes no read-cutover, Contract-to-Delivery parity, Go authority, release, live, or production claim.
      GS2-B freezes a TypeScript-owned exact-byte Contract-to-Delivery composite source schema and projector vector bundle with 43 replay cases, including 16 deterministic randomized cases, historical input, missing and incomplete evidence, promotion boundaries, bridge drift, ordering, strict failures, and the exact 500-customer per-kind limit. A pure Go package validates and recomputes the composite Snapshot bytes, integrity, node and edge identities, completeness, warnings, and error metadata against the generated mirror. It performs no external reads, HTTP handling, store writes, Scenario registration, MCP handling, or Qoder integration. TypeScript remains the sole calculation and local read authority; this batch makes no read cutover, Go authority, release, live, or production claim.
      GS3-A adds an explicit default-off MCP Graph read mirror. Successful TypeScript query/explain results are cloned to one exact loopback or explicitly internal Go HTTP origin, compared under end-to-end timeout, response-size, strict-JSON, and closed field-difference bounds, and still returned only from TypeScript. Collaboration persists unique digest-only matched, mismatched, or unavailable observations without endpoints, bodies, graph objects, evidence contents, or raw snapshot cursors. A hosted cross-language gate starts the real Go handler and requires both query and explain to match the TypeScript client. This batch adds no routing epoch, canary, cursor translation, per-request fallback, Graph-head transfer, Go read/write authority, new Qoder claim, remote Connector, release, live, or production claim.
      GS3-B adds a default-off, tenant- and scenario-selected Go read canary for MCP query/explain. The selected route binds an immutable positive routing epoch, exact service build, bounded expiry, strict canonical response validation, redacted mandatory audit, and HMAC cursor v2 carrying the epoch; legacy, expired, and cross-epoch cursors fail explicitly without translation. An explicit higher epoch selects TypeScript-local rollback. Unselected scenarios remain TypeScript-authoritative, selected failures never fall back per request, and the 12/16/17 tools, schemas, mutation boundaries, Skill, QODER_VERIFIED, remote Connector, release, live, and production claims remain unchanged.
      Software Delivery Projector v1 is active as a deterministic, side-effect-free projection over injected and explicitly complete/incomplete/missing source batches. Current GitHub authority requires live observations and current-head bindings; only completed current-head checks become verification evidence, while cache, synthetic, stale-review, self-review, non-terminal-check, missing-target, expired-lease, and incomplete evidence remain informational or incomplete. The projector does not alter existing GitHub task, claim, PR, review, merge, or watch behavior.
      The explicit graph snapshot build CLI accepts one bounded file or stdin source through a sealed two-profile dispatch under the same locked 4 MiB Software Delivery source ceiling. Each profile applies strict JSON plus its registered validator/projector and CAS-publishes only to the workspace-local graph store; unknown scenarios fail closed. It performs no live evidence collection, exposes no force overwrite, and remains separate from the side-effect-free MCP query/explain tools.
      Contract-to-Delivery Projector v1 is active as a deterministic composite projection. It invokes the existing Software Delivery projector, preserves its nodes and edges exactly, and adds bounded Customer, Contract, Project, Milestone, Acceptance, Deliverable, and Outcome relationships only from typed demo-fixture business evidence. Acceptance requires a current merged deliverable, an independent current-head human approval, and a current accepted transition; Outcome requires that promoted acceptance, a live closed work item, and the existing Software Delivery outcome. Missing or drifted bridges remain incomplete and never create dangling authority edges. The checked fixture and official stock 12-tool MCP SDK test prove the Customer-to-Outcome graph, bounded query/explain evidence, projection-only authority, and no query-side store mutation.
      Contract-to-Delivery Lite now has a repeatable credential-free local rehearsal through the official MCP SDK. It derives the current agent authority from local registry/runtime evidence, confirms exact Scenario and Workflow plans through the 16-tool agent-bound profile, persists durable Scenario/Workflow/Collaboration evidence, explicitly publishes the graph snapshot, and verifies bounded query/explain readback. The Workflow receipt records LOCAL_REHEARSAL_PASS independently from LIVE_CAPSTONE_PENDING. The business chain remains visibly demo_fixture, notification intent is not_created, notification delivery is blocked_not_configured, and live GitHub and Qoder Desktop remain not_run. The narrow aggregate claim is CONTRACT_TO_DELIVERY_LOCAL_REHEARSED; no QODER_VERIFIED, live business-evidence qualification, approval, merge, or notification-delivery claim is made.
      Scenario Runtime v1 is active as a projection-first, code-free Scenario Pack loader and local instance runtime. It uses an exact-byte closed lock, sealed host-owned projector/capability catalogs, deterministic legacy permission normalization, preview-only canonical plans, nominally trusted instances, bounded global idempotency/CAS, and fail-closed crash recovery. The built-in software-delivery Pack remains projection-only. The contract-to-delivery-lite Pack references one sealed reviewed Workflow and requests one low-risk Collaboration event capability; the Pack cannot grant that authority or load code, and the explicit agent-bound composition revalidates the current principal, permission, Scenario, resolver, executor, plan, store, and build bindings before execution.
      Scenario Pack discovery enumerates the trusted root with a bounded streaming directory reader, verifies every candidate through the existing exact-byte loader, exposes only sanitized blocked-code counts, and seals accepted definitions for the process lifetime. Pack changes require a process restart.
      Scenario and sealed Workflow planners now compile bounded intent into immutable governed-plan effects without accepting raw commands, module paths, arbitrary URLs, or unattended flags. Scenario instantiation precedes any referenced Workflow starts, and each source/catalog/input binding is rehydrated and revalidated before execution. The isolated workflow-effect approval v2 store keeps its business correlation, exact effect hashes, per-decision human attestation, one-winner CAS, and deterministic pending/recorded audit projection separate from legacy Workflow run approvals. Its local human provider persists only a bounded OS-subject hash mapping, process-seals mapping identity, binds correlation and approval expiry into each nominal decision, and keeps controlling-TTY I/O entirely separate from MCP stdin/stdout.
      Persisted Workflow start plans now recompile against the current sealed resolver and require exact host-owned plan, actor, workspace, correlation, workflow, and expiry bindings before an executor can consume them. The agent-bound MCP composition registers the real Scenario instance executor and the single reviewed Contract-to-Delivery local Workflow executor. It moves previewed instances through CAS to active and then completed state with durable readback, while every unregistered Workflow target remains a stable blocked result with no synthetic execution.
