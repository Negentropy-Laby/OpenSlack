    notes:
      Structured planner active. Webhook and Slack chat adapters active with actor mapping. PRMS chat cards and action confirmation active. The typed Operator action registry is instance-scoped, preserves the closed 30-action built-in default, accepts explicit planner/executor injection, and canonical-revalidates frozen PlanSteps at execution. The CLI application composition root constructs one sealed PluginHost and instance-scoped Operator action, LLM-provider, conversation-store, and plugin-action bindings per process. The Qoder MCP frontend uses that same composition context, where default and explicit read-only publish an exact 12-tool projection-only business and Organization Graph catalog over local stdio, explicit agent-bound selects the production 16-tool governed composition from an active registry/runtime principal, and explicit human-attested selects production 17 only after a separate local OS-subject mapping and controlling-TTY self-test; local demo adds only its bounded reset tool. Candidate-bound qualification harnesses now exercise the real production-17 controlling-TTY path and generate a credential-free stock-12 Qoder Desktop config, call plan, stale/missing graph evidence, sealed manifest, and closed receipt verifier; the harnesses do not themselves claim authenticated Desktop success. The human subject mapping persists only a one-way subject hash and asserted human principal under owner-only/no-follow state. Every decision prompt uses only /dev/tty or CON and binds the exact run, approval, decision, reason hash, capability, business correlation, and expiry; subject, mapping, ACL, TTY, abort, or deadline drift fails the requested profile before server construction with no 16/12-tool fallback. The production agent-bound composition factory derives its authority only from canonical workspace, active registry, matching runtime identity, and explicit scenario.instantiate permission evidence; it accepts no caller-supplied compiler, executor, store, audit, permission, or snapshot ports. It seals discovered Scenario definitions for the process, binds plans to exact workspace, principal, permission, catalog, resolver, lock, build, executor, and store evidence, and registers only the real Scenario instance CAS executor plus the single reviewed Contract-to-Delivery local Workflow executor. That Workflow additionally requires the exact openslack.collaboration.recordEvent permission and an active current locked Scenario; every other Workflow target remains stably blocked without a pending plan. The repeatable credential-free harness proves exact 16-tool official-SDK preview, confirmation, durable local-store evidence, explicit graph publication, and read-only query/explain while reporting business evidence as demo_fixture and live GitHub/Qoder Desktop as not_run. The agent-bound CLI fails closed before server construction if its principal, workspace assertion, permission, catalog, audit, executor, or stores cannot be bound. Every mutation is compiled into one immutable host-owned plan, returns a root-only one-time confirmation capability whose hash alone is persisted, revalidates actor/workspace/source/permission/catalog/executor/build/process bindings, and uses an atomic execution claim with reconciliation-required timeout semantics. Workflow-effect decisions require a fresh independently authenticated per-decision attestation and remain distinct from GitHub review. Their terminal CAS persists a deterministic pending audit projection; the sink writes through one composition-bound O_APPEND descriptor and advances it to recorded only after durable Collaboration append. All profiles return openslack.mcp_result.v2, reject client authority and executable steps, and expose no shell, GitHub approval, direct merge, policy, registry, permission, or generic command surface. The repository Qoder Skill is progressively disclosed, validates independently, and requires Status, Owner, Blocker, Next, and Evidence reporting; direct MCP SDK qualification and Contract-to-Delivery local rehearsal remain LOCAL_PASS. The final candidate-bound Windows run additionally records HUMAN_ATTESTED_PROFILE_LOCAL_PASS for the real production-17 controlling-TTY path and QODER_VERIFIED for the authenticated local stock-12 Qoder Work Desktop Connector plus all three Skill trigger modes. Public remote Connector, OAuth, Marketplace, Workbench, live capstone, Notification Delivery, release, and production readiness remain deferred. Its host target catalog exposes only the audited bounded github.metrics returned-item count under the exact github.issues.read capability; SHADOW plugin actions remain visibility-only, while ENFORCE proof plans are rebuilt through the same canonical registry before execution. All other built-ins and all unconfigured plugin authority remain fail-closed until complete behavior contracts, policy, activation evidence, and a durable audit sink are explicitly composed. Setup attach provides preview-first read-only-monitor and full-agent modes backed by a virtual validation plan, persistent rollback journal, workspace lock, before-hash/realpath/symlink/containment checks, atomic writes, exact byte/mode rollback, crash recovery, and idempotent apply; the foreground watcher starts only after commit and validation. Generated agents cannot approve or merge. LLM-first intent routing with deterministic keyword fallback, setup report, and 24h pending plan store active. Session-based conversation memory with multi-turn context resolution and progressive clarification. Doctor --format plain for non-technical output. Conversation-first TUI workbench with Ask OpenSlack, Operator recommendation cards, workflow draft-first cards, profile sync recommendations, and subagent mention dispatch. TUI setup report view and PR doctor view via --format tui. Versioned Windows x64 and Linux x64 archive builds embed the CLI, workflow assets, native keychain binding, build metadata, SBOM, checksums, and provenance; native build and unpacked smoke are enforced by the release matrix. The installed CLI verifies stable release artifacts and trusted signatures without a source checkout, Bun, or Node.js. Agent Runtime credentials can be previewed and imported atomically into the native keychain without writing secret values to workspace configuration.
      GS3-B preserves the exact 12/16/17 MCP catalogs while allowing one explicit tenant/scenario allowlist to select a bounded Go query/explain authority under an immutable routing epoch, expected service build, expiry, strict response validation, the same bounded snapshot-freshness gate as local TypeScript reads, and required redacted Collaboration audit. An explicit higher epoch rolls the selected scenarios back to TypeScript; stale or otherwise failed selected reads remain blocked and never fall back per request. Authenticated Qoder Desktop, remote Connector, release, live, and production claims remain separate.
      GS3-C adds a separate global Graph head/query/explain authority on the same exact profiles. It binds every scenario to one canonical workspace/tenant, routing epoch, bounded expiry, origin, and service build, rejects simultaneous mirror/canary composition, uses v2 epoch-bound cursors, and requires redacted served/rollback audit before releasing a result. TypeScript remains the deterministic projector but reports publication success only after a dedicated Go authority ingest route returns an exact durable accepted or duplicate receipt; reconciliation, conflict, transport, receipt, freshness, cursor, route, or audit failure blocks without local fallback. Go-authority and local publication deliberately remain disjoint rather than dual-writing; an explicit higher global epoch selects ts-local only after operators reproject current source evidence into the local CAS store and verify fresh reads. Missing or stale rollback evidence records a bounded authority-blocked event and never a successful rollback event. Tool names, schemas, 12/16/17 counts, Skill, mutation and approval boundaries, authenticated Desktop, remote Connector, live, release, and production claims remain unchanged.
      GS4 freezes the Operator Governed Plan v1 record, state transition, canonical JSON, SHA-256 binding, store, confirmation, audit, error, and limit contracts into exact-byte schemas, a manifest, and shared TypeScript/Go golden vectors. Its pure Go slice validates records and emits only a credential-free read model; that GS4 slice itself owns no store, transport, Qoder, GitHub, Workflow, or mutation capability. @openslack/operator remains the sole writer and execution authority, .openslack.local/operator/governed-plans remains the runtime store, and Memory Bank remains non-runtime governance context.
      GS5 adds an optional default-off TypeScript observation port and an independent PostgreSQL Go shadow for exact canonical record, confirmation, and audit observations. TypeScript alone issues each per-workspace/plan source sequence and remains the sole governed-plan writer, confirmation authority, execution claimant, mutation dispatcher, and authoritative audit emitter. The owner-only journal publishes asynchronously after authoritative durable record or audit acceptance; unavailable, mismatched, or unknown shadow results never change the TypeScript response or retry a governed mutation. The Go service verifies body-derived idempotency and source-bound fingerprints, persists immutable observations and receipts, advances its matched record head only on semantic parity, and exposes bounded private observation, projection, health, version, and metrics routes without accepting credentials, raw confirmation capabilities, executable actions, Workflow commands, Qoder authority, GitHub authority, or project Memory Bank authority. A committed semantic mismatch is durable observational evidence; reconciliation_required is reserved for an unknown database commit outcome. The reviewed fixed-image Go, race, PostgreSQL restart, OpenAPI, Prometheus, distribution, source-manifest, and image-smoke gates must pass on the exact hosted head before GS5 is cited as hosted qualification.
      GS6 adds immutable per-record `go / governance-control` or `ts-local / typescript` routing for newly created governed plans. Missing routes remain legacy local authority. For an explicit Go route, PostgreSQL becomes the only durable plan writer after a strict accepted or duplicate receipt; TypeScript remains the compiler, token and binding validator, sealed action dispatcher, and Collaboration audit projector. Higher epochs affect only new records, old Go records retain their transport while draining, and timeout or unknown commit enters reconciliation without local fallback or double write. The exact 12/16/17 MCP catalogs and approval boundaries remain unchanged. Authenticated Desktop, QODER_VERIFIED, remote MCP/OAuth, old-record migration, TypeScript writer deletion, release, live, and production claims remain separate and unestablished.

